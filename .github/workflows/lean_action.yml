name: Execute Lean Verification and Save Result

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-lean:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # 2. Native Lean 4 build & dependency resolution
    - name: Build and Verify Lean Project
      uses: leanprover/lean-action@v1

    # 3. Capture proof output receipt
    - name: Save Proof Verification Receipt
      run: |
        lake env lean gauss.lean > lean_output.txt
        cat lean_output.txt

    # 4. Commit proof output back to repository for Overleaf sync
    - name: Commit and Push Proof Receipt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if git status --porcelain | grep -qE "lean_output.txt|lake-manifest.json"; then
          git add lean_output.txt lake-manifest.json
          git commit -m "chore: update proof verification receipt [skip ci]"
          git push
        else
          echo "No changes detected"
        fi
