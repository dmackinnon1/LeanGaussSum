name: Execute Lean Verification and Save Result

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-lean:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull code from repository
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # 2. Set up Lean toolchain without triggering manifest/cache hooks
    - name: Set up Lean 4
      uses: leanprover/lean-action@v1
      with:
        build: false
        auto-config: false
        use-mathlib-cache: false

    # 3. Generate correct native manifest and fetch Mathlib cache explicitly
    - name: Build Manifest & Environment
      run: |
        lake update
        lake exe cache get

    # 4. Run verification and write output receipt
    - name: Run Lean Verification
      run: |
        lake env lean gauss.lean > lean_output.txt
        cat lean_output.txt

    # 5. Commit lean_output.txt and generated lake-manifest.json back to GitHub
    - name: Commit Proof Receipt and Manifest
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if git status --porcelain | grep -qE "lean_output.txt|lake-manifest.json"; then
          git add lean_output.txt lake-manifest.json
          git commit -m "chore: update proof verification receipt and lake manifest [skip ci]"
          git push
        else
          echo "No changes detected"
        fi
