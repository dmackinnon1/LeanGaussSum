name: Execute Lean Verification and Save Result

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-lean:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # 2. Automatically set up Lean 4, update dependencies, and build
    - name: Build Lean Project
      uses: leanprover/lean-action@v1

    # 3. Print the verified proof receipt to lean_output.txt
    - name: Save Proof Verification Receipt
      run: |
        lake env lean gauss.lean > lean_output.txt
        cat lean_output.txt

    # 4. Commit and push back to repository for Overleaf sync
    - name: Commit and Push Proof Receipt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if git status --porcelain | grep -q "lean_output.txt"; then
          git add lean_output.txt
          git commit -m "chore: update lean_output.txt proof verification token [skip ci]"
          git push
        else
          echo "No changes detected in lean_output.txt"
        fi
